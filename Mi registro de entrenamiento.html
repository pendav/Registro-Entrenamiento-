<!DOCTYPE html>
<html lang="es" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi registro de entrenamiento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#1B2430;--muted:#5E6B7A;--line:#D9E0E7;--up:#2A5BD7;--low:#0F8A6D;--upbg:#E6EDFC;--lowbg:#DFF3EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171D;--surface:#1B222B;--ink:#E8EDF2;--muted:#93A0AE;--line:#2B3541;--up:#7AA2FF;--low:#4FD1AE;--upbg:#1E2B4A;--lowbg:#17352E}}
:root[data-theme="dark"]{--bg:#12171D;--surface:#1B222B;--ink:#E8EDF2;--muted:#93A0AE;--line:#2B3541;--up:#7AA2FF;--low:#4FD1AE;--upbg:#1E2B4A;--lowbg:#17352E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:30px}
h2{font-size:22px}
.muted{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.nav{display:flex;gap:6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;min-height:58px}
.day[aria-pressed="true"]{border-color:var(--ink);border-width:2px}
.day b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;line-height:1.1}
.day small{color:var(--muted);font-size:12px}
.dots{display:flex;justify-content:center;gap:4px;height:8px;margin-top:3px}
.dots i{width:8px;height:8px;border-radius:50%}
.d-up{background:var(--up)}.d-low{background:var(--low)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:500}
.seg label:has(input[value=up]:checked){background:var(--upbg);border-color:var(--up);color:var(--up)}
.seg label:has(input[value=low]:checked){background:var(--lowbg);border-color:var(--low);color:var(--low)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
.go{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px;font-weight:500;min-height:44px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum div{border-radius:10px;padding:10px 12px}
.sum .u{background:var(--upbg);color:var(--up)}.sum .l{background:var(--lowbg);color:var(--low)}
.sum b{font-family:'Barlow Condensed',sans-serif;font-size:30px;line-height:1;display:block}
.sec h2{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec h2 span{width:10px;height:22px;border-radius:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row .n{font-weight:500}
.row .d{color:var(--muted);font-size:14px}
.row .x{background:none;border:0;color:var(--muted);padding:8px;min-height:40px;text-decoration:underline}
.sum .all{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.prog{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .25s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-width:44px;min-height:44px;border-radius:8px;border:2px solid var(--c);background:transparent;color:var(--c);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.libh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.libchips{display:flex;flex-wrap:wrap;gap:8px}
.lib-b{border:1px solid var(--c);color:var(--c);background:transparent;border-radius:8px;padding:8px 12px;min-height:44px;text-align:left}
.lib-b b{font-weight:500;display:block}
.lib-b small{color:var(--muted);font-size:13px}
.keep{display:flex;gap:8px;align-items:center;margin:0 0 10px;color:var(--muted);font-size:15px;min-height:32px}
.keep input{width:20px;height:20px}
.empty{color:var(--muted);padding:6px 0 2px}
</style>
</head>
<body>
<main>
  <h1>Mi registro de entrenamiento</h1>
  <div class="bar">
    <div class="nav">
      <button class="btn" id="prev" aria-label="Día anterior">‹</button>
      <button class="btn" id="today">Hoy</button>
      <button class="btn" id="next" aria-label="Día siguiente">›</button>
    </div>
    <input type="date" id="date" aria-label="Fecha" style="width:auto">
  </div>
  <div class="week" id="week"></div>

  <div class="card">
    <h2 style="margin-bottom:10px">Agregar ejercicio</h2>
    <div class="seg">
      <label><input type="radio" name="g" value="up" checked><span>Tren superior</span></label>
      <label><input type="radio" name="g" value="low"><span>Tren inferior</span></label>
    </div>
    <div class="f"><label for="name">Ejercicio</label><input type="text" id="name" list="sug" autocomplete="off" placeholder="Ej. Press de banca"></div>
    <datalist id="sug"></datalist>
    <div class="grid">
      <div class="f"><label for="sets">Series (meta)</label><input type="number" id="sets" min="1" inputmode="numeric" value="3"></div>
      <div class="f"><label for="reps">Repeticiones</label><input type="number" id="reps" min="1" inputmode="numeric" value="10"></div>
      <div class="f"><label for="kg">Peso (kg)</label><input type="number" id="kg" min="0" step="0.5" inputmode="decimal" placeholder="Opcional"></div>
    </div>
    <label class="keep"><input type="checkbox" id="keep" checked> Guardar en mi biblioteca</label>
    <button class="go" id="add">Agregar ejercicio</button>
  </div>

  <div class="card" id="lib"></div>
  <div class="sum" id="sum"></div>
  <div class="card sec" id="up"></div>
  <div class="card sec" id="low"></div>
</main>
<script>
(function(){
var KEY='entreno-v1',LKEY='entreno-lib-v1',entries=[],lib=[],edit=false,sel=iso(new Date());
var SUG={up:['Press de banca','Dominadas','Remo con barra','Press militar','Fondos','Curl de bíceps','Extensión de tríceps'],
low:['Sentadilla','Peso muerto rumano','Prensa','Zancadas','Hip thrust','Elevación de talones','Curl femoral']};
var LABEL={up:'Tren superior',low:'Tren inferior'};
function $(i){return document.getElementById(i)}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var r=localStorage.getItem(KEY);if(r)entries=JSON.parse(r)||[]}catch(e){entries=[]}entries.forEach(function(e){if(e.done===undefined)e.done=e.sets})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}
function addEntry(g,n,s,r,k){entries.push({id:Date.now()+''+Math.floor(Math.random()*1000),date:sel,g:g,name:n,sets:s,done:0,reps:r,kg:k});save()}
function saveLib(){try{localStorage.setItem(LKEY,JSON.stringify(lib))}catch(e){}}
function upsert(e){var k=e.g+'|'+e.name.toLowerCase(),f=lib.filter(function(x){return x.k===k})[0],o={k:k,g:e.g,name:e.name,sets:e.sets,reps:e.reps,kg:e.kg};if(f)for(var i in o)f[i]=o[i];else lib.push(o)}
function loadLib(){try{var r=localStorage.getItem(LKEY);if(r)lib=JSON.parse(r)||[]}catch(e){lib=[]}
  if(!lib.length&&entries.length){entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(upsert);saveLib()}}
function renderLib(){
  var g=group(),c=g==='up'?'var(--up)':'var(--low)',h='';
  lib.forEach(function(x,i){if(x.g!==g)return;
    h+=edit?'<button class="lib-b" data-li="'+i+'" aria-label="Eliminar '+esc(x.name)+'">✕ '+esc(x.name)+'</button>'
      :'<button class="lib-b" data-li="'+i+'"><b>'+esc(x.name)+'</b><small>'+x.sets+' × '+x.reps+(x.kg?' · '+x.kg+' kg':'')+'</small></button>'});
  $('lib').innerHTML='<div class="libh"><h2>Mi biblioteca · '+LABEL[g]+'</h2>'+(h?'<button class="btn" data-ed="1">'+(edit?'Listo':'Editar')+'</button>':'')+'</div>'+
    (h?'<div class="libchips" style="--c:'+c+'">'+h+'</div>':'<div class="empty">Aún no tienes ejercicios guardados. Los que agregues arriba se guardan aquí y los registras con un toque.</div>');
}
function group(){return document.querySelector('input[name=g]:checked').value}
function setSug(){var g=group(),seen={},n=lib.filter(function(x){return x.g===g}).map(function(x){return x.name}).concat(SUG[g]).filter(function(s){var k=s.toLowerCase();if(seen[k])return false;seen[k]=1;return true});$('sug').innerHTML=n.map(function(s){return '<option value="'+esc(s)+'">'}).join('')}

function render(){
  $('date').value=sel;
  var days=['dom','lun','mar','mié','jue','vie','sáb'],h='';
  for(var i=-6;i<=0;i++){
    var s=shift(iso(new Date()),i),d=parse(s),has={up:0,low:0};
    entries.forEach(function(e){if(e.date===s)has[e.g]=1});
    h+='<button class="day" data-d="'+s+'" aria-pressed="'+(s===sel)+'"><small>'+days[d.getDay()]+'</small><b>'+d.getDate()+'</b><div class="dots">'+(has.up?'<i class="d-up"></i>':'')+(has.low?'<i class="d-low"></i>':'')+'</div></button>';
  }
  $('week').innerHTML=h;
  var day=entries.filter(function(e){return e.date===sel});
  function tot(g){var l=day.filter(function(e){return e.g===g});return {s:l.reduce(function(a,e){return a+e.sets},0),d:l.reduce(function(a,e){return a+e.done},0),r:l.reduce(function(a,e){return a+e.done*e.reps},0),l:l}}
  var U=tot('up'),L=tot('low');
  var td=U.d+L.d,tt=U.s+L.s;
  $('sum').innerHTML='<div class="all"><b>'+td+' / '+tt+'</b>series completadas hoy<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+tt+'" aria-valuenow="'+td+'"><i style="width:'+(tt?Math.round(td/tt*100):0)+'%"></i></div></div><div class="u"><b>'+U.d+' / '+U.s+'</b>series de tren superior · '+U.r+' reps</div><div class="l"><b>'+L.d+' / '+L.s+'</b>series de tren inferior · '+L.r+' reps</div>';
  [['up',U],['low',L]].forEach(function(p){
    var g=p[0],t=p[1],c=g==='up'?'var(--up)':'var(--low)';
    var body=t.l.length?t.l.map(function(e){
      var chips='';for(var i=0;i<e.sets;i++)chips+='<button class="chip" data-set="'+e.id+':'+i+'" aria-pressed="'+(i<e.done)+'" aria-label="Serie '+(i+1)+'">'+(i+1)+'</button>';
      return '<div class="row"><div style="flex:1"><div class="n">'+esc(e.name)+'</div><div class="d">'+e.done+' de '+e.sets+' series · '+e.reps+' reps'+(e.kg?' · '+e.kg+' kg':'')+'</div><div class="chips" style="--c:'+c+'">'+chips+'</div></div><button class="x" data-del="'+e.id+'" aria-label="Quitar '+esc(e.name)+'">Quitar</button></div>';
    }).join(''):'<div class="empty">Aún no hay ejercicios de '+LABEL[g].toLowerCase()+' este día.</div>';
    $(g).innerHTML='<h2><span style="background:'+c+'"></span>'+LABEL[g]+'</h2>'+body;
  });
}

$('add').onclick=function(){
  var n=$('name').value.trim(),s=+$('sets').value,r=+$('reps').value,k=$('kg').value;
  if(!n){$('name').focus();return}
  if(!(s>0)||!(r>0)){(s>0?$('reps'):$('sets')).focus();return}
  var kk=k===''?null:+k;addEntry(group(),n,s,r,kk);
  if($('keep').checked){upsert({g:group(),name:n,sets:s,reps:r,kg:kk});saveLib()}
  $('name').value='';$('name').focus();setSug();renderLib();render();
};
$('name').addEventListener('keydown',function(e){if(e.key==='Enter')$('add').click()});
$('name').addEventListener('input',function(){var v=this.value.trim().toLowerCase(),g=group(),f=lib.filter(function(x){return x.g===g&&x.name.toLowerCase()===v})[0];if(f){$('sets').value=f.sets;$('reps').value=f.reps;$('kg').value=f.kg==null?'':f.kg}});
document.body.addEventListener('click',function(e){
  if(e.target.closest('[data-ed]')){edit=!edit;renderLib();return}
  var li=e.target.closest('[data-li]');
  if(li){var ix=+li.getAttribute('data-li'),it=lib[ix];if(it){if(edit){lib.splice(ix,1);saveLib();setSug();renderLib()}else{addEntry(it.g,it.name,it.sets,it.reps,it.kg);render()}}return}
  var c=e.target.closest('[data-set]');
  if(c){var q=c.getAttribute('data-set').split(':'),k=+q[1];entries.forEach(function(x){if(x.id===q[0])x.done=(k<x.done)?k:k+1});save();render();return}
  var t=e.target.closest('[data-del]');
  if(t){entries=entries.filter(function(x){return x.id!==t.getAttribute('data-del')});save();render();return}
  var d=e.target.closest('[data-d]');
  if(d){sel=d.getAttribute('data-d');render()}
});
document.querySelectorAll('input[name=g]').forEach(function(i){i.onchange=function(){setSug();renderLib()}});
$('prev').onclick=function(){sel=shift(sel,-1);render()};
$('next').onclick=function(){sel=shift(sel,1);render()};
$('today').onclick=function(){sel=iso(new Date());render()};
$('date').onchange=function(){if(this.value){sel=this.value;render()}};
load();loadLib();setSug();renderLib();render();
})();
</script>
</body>
</html>
